uuid = "d5905c27-7ec2-41c1-bd08-70c38a4fa7fc"
name = "Release Type in Title"
authors = ["Bob Swift"]
description = "This plugin automatically places selected release type information in the title of the release."
api = ['3.0']
license = "GPL-2.0-or-later"
license_url = "https://www.gnu.org/licenses/gpl-2.0.html"
long_description = """
This plugin automatically places selected release type information in the title of the release. It is based on the Picard 2 plugin "Release Type" by Elliot Chance.

The plugin checks the existing release title to determine whether the release type already appears in the title. If not, and the release type is one of those selected for inclusion, the release type is added to the release title.

The release types to include, and the text to add are defined by the user in the plugin's option settings.
"""
categories = ["metadata"]
homepage = "https://picard-plugins-user-guides.readthedocs.io/en/latest/release_type_in_title/user_guide.html"
report_bugs_to = "https://github.com/rdswift/picard-plugin-release-type-in-title/issues"

[name_i18n]
fr = "Indiquer le type de publication dans le titre"

[description_i18n]
fr = "Ce plugin insère automatiquement les informations relatives au type de publication sélectionné dans le titre de la publication."

[long_description_i18n]
fr = "Ce plugin insère automatiquement les informations relatives au type de publication sélectionné dans le titre de la publication. Il s'inspire du plugin Picard 2 « Release Type » d'Elliot Chance.\n\nLe plugin vérifie le titre existant de la version afin de déterminer si le type de version y figure déjà. Si ce n'est pas le cas et que le type de version fait partie de ceux sélectionnés pour être inclus, celui-ci est ajouté au titre de la version.\n\nLes types de version à inclure et le texte à ajouter sont définis par l'utilisateur dans les paramètres d'options du plugin."
