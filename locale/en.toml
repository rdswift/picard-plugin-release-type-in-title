"manifest.description" = "This plugin automatically places selected release type information in the title of the release."
"manifest.long_description" = "This plugin automatically places selected release type information in the title of the release. It is based on the Picard 2 plugin \"Release Type\" by Elliot Chance.\n\nThe plugin checks the existing release title to determine whether the release type already appears in the title. If not, and the release type is one of those selected for inclusion, the release type is added to the release title.\n\nThe release types to include, and the text to add are defined by the user in the plugin's option settings."
"manifest.name" = "Release Type in Title"

"qt.ReleaseTypeInTitleOptionsPage.option.demo.title" = "Demo"
"qt.ReleaseTypeInTitleOptionsPage.option.ep.title" = "EP"
"qt.ReleaseTypeInTitleOptionsPage.option.live.title" = "Live"
