"qt.ReleaseTypeInTitleOptionsPage.option.single.title" = "Single"
"qt.ReleaseTypeInTitleOptionsPage.option.soundtrack.title" = "Soundtrack"
"qt.ReleaseTypeInTitleOptionsPage.page.text" = "These settings will determine the release types to include in the release title, and the text to use when including a type. Only the types enabled below will be checked for inclusion in the release title."
"qt.ReleaseTypeInTitleOptionsPage.page.title" = "Release Type in Title"
"qt.ReleaseTypeInTitleOptionsPage.section.types_list.title" = "Release types to include:"

