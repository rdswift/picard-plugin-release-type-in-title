"manifest.description" = "Ce plugin insère automatiquement les informations relatives au type de publication sélectionné dans le titre de la publication."
"manifest.long_description" = "Ce plugin insère automatiquement les informations relatives au type de publication sélectionné dans le titre de la publication. Il s'inspire du plugin Picard 2 « Release Type » d'Elliot Chance.\n\nLe plugin vérifie le titre existant de la version afin de déterminer si le type de version y figure déjà. Si ce n'est pas le cas et que le type de version fait partie de ceux sélectionnés pour être inclus, celui-ci est ajouté au titre de la version.\n\nLes types de version à inclure et le texte à ajouter sont définis par l'utilisateur dans les paramètres d'options du plugin."
"manifest.name" = "Indiquer le type de publication dans le titre"

